  </defs>

  <!-- Camera Body with Speech Bubble Pointer -->
  <path d="M42 22 L50 22 C52 18 56 16 60 16 L70 16 C74 16 78 18 80 22 L88 22 C99 22 108 31 108 42 L108 72 C108 83 99 92 88 92 L44 92 L24 104 L26 86 C18 83 14 76 14 68 L14 42 C14 31 23 22 34 22 Z" 
